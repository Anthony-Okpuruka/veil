<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="favAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F3EFE8" stop-opacity="1" />
      <stop offset="35%" stop-color="#D8BD83" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#76618F" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#08080B" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D8BD83" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#76618F" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#C5A46D" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Deep space background -->
  <rect width="64" height="64" rx="16" fill="#08080B" />
  <circle cx="32" cy="32" r="30" fill="#111015" stroke="#302A34" stroke-width="1.2" />

  <!-- Concentric starfield rings (revealing aperture) -->
  <circle cx="32" cy="32" r="23" fill="none" stroke="#302A34" stroke-width="1" />
  <circle cx="32" cy="32" r="17" fill="none" stroke="url(#orbitGrad)" stroke-width="1.2" stroke-dasharray="3 3.5" />
  <circle cx="32" cy="32" r="11" fill="none" stroke="#D8BD83" stroke-width="1.4" opacity="0.85" />

  <!-- Constellation star cluster points -->
  <circle cx="32" cy="9" r="1.5" fill="#F3EFE8" />
  <circle cx="48" cy="19" r="1.2" fill="#D8BD83" />
  <circle cx="53" cy="34" r="1.4" fill="#F3EFE8" />
  <circle cx="45" cy="49" r="1.3" fill="#D8BD83" />
  <circle cx="32" cy="55" r="1.5" fill="#C5A46D" />
  <circle cx="17" cy="48" r="1.3" fill="#76618F" />
  <circle cx="11" cy="32" r="1.4" fill="#F3EFE8" />
  <circle cx="19" cy="18" r="1.2" fill="#D8BD83" />

  <!-- Inner orbital nodes -->
  <circle cx="32" cy="15" r="1.8" fill="#F3EFE8" />
  <circle cx="44" cy="24" r="1.5" fill="#D8BD83" />
  <circle cx="47" cy="37" r="1.4" fill="#F3EFE8" />
  <circle cx="38" cy="48" r="1.5" fill="#C5A46D" />
  <circle cx="23" cy="45" r="1.4" fill="#76618F" />
  <circle cx="17" cy="32" r="1.8" fill="#D8BD83" />
  <circle cx="24" cy="21" r="1.4" fill="#F3EFE8" />

  <!-- Singularity core glow -->
  <circle cx="32" cy="32" r="8" fill="url(#favAura)" />
  <circle cx="32" cy="32" r="3.2" fill="#08080B" stroke="#D8BD83" stroke-width="1.2" />
  <circle cx="32" cy="32" r="1.5" fill="#FFFFFF" />
</svg>
